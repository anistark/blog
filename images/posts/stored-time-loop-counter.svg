<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>A circular arrow with a loop counter in the middle that ticks up from 1 to 160. Beside it, a map fills in lap by lap: where the enemy lands, where a weapon jams, and finally a complete safe route to the objective</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <style>
    .spin { transform-box: view-box; transform-origin: 250px 268px; animation: spin 12s cubic-bezier(0.25, 0.6, 0.3, 1) infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 52%, 100% { transform: rotate(1440deg); } }
    .n { opacity: 0; }
    .n160 { opacity: 1; }
    .n1 { animation: n1 12s linear infinite; }
    .n2 { animation: n2 12s linear infinite; }
    .n3 { animation: n3 12s linear infinite; }
    .n12 { animation: n12 12s linear infinite; }
    .n47 { animation: n47 12s linear infinite; }
    .n98 { animation: n98 12s linear infinite; }
    .n131 { animation: n131 12s linear infinite; }
    .n160 { animation: n160 12s linear infinite; }
    @keyframes n1 { 0%, 5% { opacity: 1; } 5.4%, 99.5% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes n2 { 0%, 5% { opacity: 0; } 5.4%, 10% { opacity: 1; } 10.4%, 100% { opacity: 0; } }
    @keyframes n3 { 0%, 10% { opacity: 0; } 10.4%, 16% { opacity: 1; } 16.4%, 100% { opacity: 0; } }
    @keyframes n12 { 0%, 16% { opacity: 0; } 16.4%, 24% { opacity: 1; } 24.4%, 100% { opacity: 0; } }
    @keyframes n47 { 0%, 24% { opacity: 0; } 24.4%, 34% { opacity: 1; } 34.4%, 100% { opacity: 0; } }
    @keyframes n98 { 0%, 34% { opacity: 0; } 34.4%, 44% { opacity: 1; } 44.4%, 100% { opacity: 0; } }
    @keyframes n131 { 0%, 44% { opacity: 0; } 44.4%, 52% { opacity: 1; } 52.4%, 100% { opacity: 0; } }
    @keyframes n160 { 0%, 52% { opacity: 0; } 52.4%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .m { transform-box: fill-box; transform-origin: 50% 50%; }
    .m1 { animation: m1 12s ease-out infinite; }
    .m2 { animation: m2 12s ease-out infinite; }
    .m3 { animation: m3 12s ease-out infinite; }
    .m4 { animation: m4 12s ease-out infinite; }
    @keyframes m1 { 0%, 16% { opacity: 0; transform: scale(0.7); } 18.5%, 95% { opacity: 1; transform: scale(1); } 99%, 100% { opacity: 0; } }
    @keyframes m2 { 0%, 24% { opacity: 0; transform: scale(0.7); } 26.5%, 95% { opacity: 1; transform: scale(1); } 99%, 100% { opacity: 0; } }
    @keyframes m3 { 0%, 34% { opacity: 0; transform: scale(0.7); } 36.5%, 95% { opacity: 1; transform: scale(1); } 99%, 100% { opacity: 0; } }
    @keyframes m4 { 0%, 52% { opacity: 0; transform: scale(0.7); } 55%, 95% { opacity: 1; transform: scale(1); } 99%, 100% { opacity: 0; } }
    .reveal { stroke-dashoffset: 0; animation: reveal 12s ease-in-out infinite; }
    @keyframes reveal { 0%, 34% { stroke-dashoffset: 1; } 52%, 100% { stroke-dashoffset: 0; } }
    .route { animation: route 12s linear infinite; }
    @keyframes route { 0%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="warm" cx="250" cy="268" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f5b544" stop-opacity="0.08"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.045"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/></linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#f5b544"/></marker>
    <clipPath id="map-clip"><rect x="480" y="84" width="472" height="368" rx="14"/></clipPath>
    <mask id="route-mask" maskUnits="userSpaceOnUse" x="480" y="84" width="472" height="368">
      <path class="reveal" d="M532 408 C580 392 566 338 612 318 S704 318 704 268 S768 214 812 214 S878 172 900 132" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
    </mask>
  </defs>

  <rect width="1000" height="500" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="500" rx="20" fill="url(#sheen)"/>
  <rect width="1000" height="500" rx="20" fill="url(#warm)"/>
  <rect x="0.5" y="0.5" width="999" height="499" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">LOOP COUNTER</text>

  <!-- the loop -->
  <circle cx="250" cy="268" r="130" fill="none" stroke="#232834" stroke-width="1.5"/>
  <g class="spin">
    <path d="M272.6 140 A130 130 0 1 1 205.5 145.8" fill="none" stroke="#f5b544" stroke-width="3" stroke-linecap="round" marker-end="url(#head)" filter="url(#glow)"/>
  </g>
  <text x="250" y="236" text-anchor="middle" font-size="12" letter-spacing="2.4" fill="#7d8597">LOOP</text>
  <g font-size="60" font-weight="700" fill="#eef1f6" text-anchor="middle">
    <text class="n n1" x="250" y="298">1</text>
    <text class="n n2" x="250" y="298">2</text>
    <text class="n n3" x="250" y="298">3</text>
    <text class="n n12" x="250" y="298">12</text>
    <text class="n n47" x="250" y="298">47</text>
    <text class="n n98" x="250" y="298">98</text>
    <text class="n n131" x="250" y="298">131</text>
    <text class="n n160" x="250" y="298">160</text>
  </g>
  <text x="250" y="330" text-anchor="middle" font-size="12" fill="#7d8597">die · wake · retry</text>

  <!-- the map -->
  <rect x="480" y="84" width="472" height="368" rx="14" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.08"/>
  <g clip-path="url(#map-clip)">
    <g stroke="#ffffff" stroke-opacity="0.035">
      <line x1="512" y1="84" x2="512" y2="452"/><line x1="560" y1="84" x2="560" y2="452"/><line x1="608" y1="84" x2="608" y2="452"/><line x1="656" y1="84" x2="656" y2="452"/>
      <line x1="704" y1="84" x2="704" y2="452"/><line x1="752" y1="84" x2="752" y2="452"/><line x1="800" y1="84" x2="800" y2="452"/><line x1="848" y1="84" x2="848" y2="452"/>
      <line x1="896" y1="84" x2="896" y2="452"/><line x1="944" y1="84" x2="944" y2="452"/>
      <line x1="480" y1="116" x2="952" y2="116"/><line x1="480" y1="164" x2="952" y2="164"/><line x1="480" y1="212" x2="952" y2="212"/><line x1="480" y1="260" x2="952" y2="260"/>
      <line x1="480" y1="308" x2="952" y2="308"/><line x1="480" y1="356" x2="952" y2="356"/><line x1="480" y1="404" x2="952" y2="404"/>
    </g>
    <g fill="none" stroke="#2c3240" stroke-width="1.2">
      <path d="M560 180 C600 140 680 150 690 190 S640 250 590 240 S530 210 560 180 Z"/>
      <path d="M580 186 C606 166 650 170 656 192 S626 226 598 222 S566 202 580 186 Z"/>
      <path d="M770 340 C820 300 920 320 930 370 S880 440 820 430 S730 380 770 340 Z"/>
      <path d="M800 350 C830 330 890 342 896 372 S862 414 828 408 S778 376 800 350 Z"/>
      <path d="M846 362 C858 356 874 362 874 374 S858 392 846 388 S836 368 846 362 Z"/>
      <path d="M760 84 C780 120 840 120 870 96"/>
    </g>
  </g>

  <!-- start and objective -->
  <circle cx="532" cy="408" r="6" fill="#12151c" stroke="#c5cad6" stroke-width="2"/>
  <text x="546" y="430" font-size="12" fill="#7d8597">start</text>

  <!-- lap marks -->
  <g class="m m1">
    <path d="M638 366 l12 12 M650 366 l-12 12" stroke="#f2676b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="660" y="376" font-size="12" fill="#c5cad6"><tspan fill="#7d8597">loop 12 ·</tspan> enemy lands here</text>
  </g>
  <g class="m m2">
    <circle cx="534" cy="290" r="11" fill="#12151c" stroke="#c5cad6" stroke-width="1.5"/>
    <path d="M534 284 v7 M534 295 v0.5" stroke="#eef1f6" stroke-width="2" stroke-linecap="round"/>
    <text x="510" y="266" font-size="12" fill="#c5cad6"><tspan fill="#7d8597">loop 47 ·</tspan> weapon jams</text>
  </g>
  <g class="m m3">
    <path d="M866 262 l12 12 M878 262 l-12 12" stroke="#f2676b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M786 274 l12 12 M798 274 l-12 12" stroke="#f2676b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="728" y="308" font-size="12" fill="#c5cad6"><tspan fill="#7d8597">loop 98 ·</tspan> more landings</text>
  </g>

  <!-- the route, revealed lap by lap -->
  <g class="route" mask="url(#route-mask)">
    <path d="M532 408 C580 392 566 338 612 318 S704 318 704 268 S768 214 812 214 S878 172 900 132" fill="none" stroke="#f5b544" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
  </g>
  <g class="m m4">
    <g filter="url(#glow)">
      <path d="M900 120 l12 12 l-12 12 l-12 -12 Z" fill="#f5b544"/>
    </g>
    <text x="928" y="126" font-size="12" text-anchor="end" fill="#eef1f6" transform="translate(-4 -20)"><tspan fill="#7d8597">loop 160 ·</tspan> route complete</text>
  </g>
</svg>
