<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="system-ui, sans-serif">
  <title>A parent repository and its fork share one network of commits. A workflow references actions/checkout at a SHA that only exists in the fork, and GitHub resolves it through the parent's name anyway</title>
  <style>
    .flow { stroke-dasharray: 6 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <rect width="1000" height="520" fill="#1a1a19"/>

  <text x="60" y="58" font-size="22" font-weight="700" fill="#ffffff">A full SHA can still come from a fork</text>
  <text x="60" y="86" font-size="15" fill="#c3c2b7">a repository and its forks share one network of commits</text>

  <!-- workflow card -->
  <rect x="60" y="150" width="330" height="96" rx="12" fill="#242423" stroke="#3a3a38"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <text x="82" y="184" fill="#6b6b66">uses:</text>
    <text x="82" y="210" fill="#ffffff">actions/checkout</text>
    <text x="82" y="230" fill="#e66767">@&lt;fork-only sha&gt;</text>
  </g>
  <text x="60" y="276" font-size="13" fill="#c3c2b7">looks like a normal SHA pin</text>

  <!-- network -->
  <rect x="470" y="120" width="470" height="340" rx="16" fill="none" stroke="#3a3a38" stroke-dasharray="4 6"/>
  <text x="490" y="146" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6b6b66">FORK NETWORK</text>

  <!-- parent -->
  <text x="500" y="196" font-size="14" font-weight="600" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">actions/checkout</text>
  <line x1="510" y1="226" x2="900" y2="226" stroke="#3987e5" stroke-width="2"/>
  <circle cx="530" cy="226" r="8" fill="#3987e5"/>
  <circle cx="640" cy="226" r="8" fill="#3987e5"/>
  <circle cx="750" cy="226" r="8" fill="#3987e5"/>
  <circle cx="860" cy="226" r="8" fill="#3987e5"/>
  <text x="860" y="254" font-size="12" fill="#c3c2b7" text-anchor="middle">reviewed by maintainers</text>

  <!-- fork -->
  <text x="500" y="316" font-size="14" font-weight="600" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">someone/checkout (fork)</text>
  <path d="M 750 234 C 770 300, 800 346, 850 346" fill="none" stroke="#6b6b66" stroke-width="2"/>
  <circle cx="860" cy="346" r="10" fill="#2a1f1f" stroke="#e66767" stroke-width="2"/>
  <text x="860" y="380" font-size="13" fill="#e66767" text-anchor="middle">fork-only commit</text>
  <text x="860" y="398" font-size="12" fill="#c3c2b7" text-anchor="middle">nobody upstream saw it</text>

  <!-- resolution -->
  <path class="flow" d="M 390 240 C 430 400, 650 350, 849 346" fill="none" stroke="#e66767" stroke-width="2"/>
  <text x="540" y="410" font-size="13" fill="#e66767">GitHub resolves it anyway</text>

  <text x="60" y="496" font-size="12" fill="#6b6b66">Described by Chainguard (2023) and detected by zizmor's impostor-commit audit</text>
</svg>
