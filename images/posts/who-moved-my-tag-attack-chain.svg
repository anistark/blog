<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="system-ui, sans-serif">
  <title>Attack chain behind the tj-actions compromise, per Unit 42: November 28, 2024 a SpotBugs maintainer adds a personal access token to a workflow; December 6, 2024 it leaks through a malicious pull_request_target pull request; March 11, 2025 the reviewdog/action-setup v1 tag points to malicious code; March 14, 2025 tj-actions/changed-files tags are repointed, targeting coinbase/agentkit, with over 23,000 repositories using the action</title>
  <rect width="1000" height="500" fill="#1a1a19"/>

  <text x="60" y="58" font-size="22" font-weight="700" fill="#ffffff">From one leaked token to 23,000 repositories</text>
  <text x="60" y="86" font-size="15" fill="#c3c2b7">the chain behind CVE-2025-30066, as traced by Unit 42</text>

  <!-- rail -->
  <g stroke-width="2" fill="none">
    <line x1="130" y1="200" x2="355" y2="200" stroke="#3a3a38"/>
    <line x1="355" y1="200" x2="425" y2="200" stroke="#3a3a38" stroke-dasharray="3 6"/>
    <line x1="425" y1="200" x2="870" y2="200" stroke="#3a3a38"/>
  </g>
  <text x="390" y="186" font-size="12" fill="#6b6b66" text-anchor="middle">~3 months</text>

  <!-- dates -->
  <g font-size="13" font-weight="600" fill="#c3c2b7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="130" y="160">2024-11-28</text>
    <text x="320" y="160">2024-12-06</text>
    <text x="580" y="160">2025-03-11</text>
    <text x="870" y="160">2025-03-14</text>
  </g>

  <!-- nodes -->
  <circle cx="130" cy="200" r="11" fill="#242423" stroke="#3a3a38" stroke-width="2"/>
  <circle cx="320" cy="200" r="11" fill="#2a1f1f" stroke="#e66767" stroke-width="2"/>
  <circle cx="580" cy="200" r="11" fill="#2a1f1f" stroke="#e66767" stroke-width="2"/>
  <circle cx="870" cy="200" r="11" fill="#e66767"/>

  <!-- cards -->
  <rect x="50" y="240" width="160" height="170" rx="10" fill="#242423" stroke="#3a3a38"/>
  <text x="66" y="268" font-size="14" font-weight="700" fill="#ffffff">SpotBugs</text>
  <g font-size="12.5" fill="#c3c2b7">
    <text x="66" y="294">a maintainer puts</text>
    <text x="66" y="312">their own PAT in a</text>
    <text x="66" y="330">sonar-findbugs</text>
    <text x="66" y="348">workflow</text>
  </g>

  <rect x="240" y="240" width="160" height="170" rx="10" fill="#242423" stroke="#3a3a38"/>
  <text x="256" y="268" font-size="14" font-weight="700" fill="#ffffff">SpotBugs</text>
  <g font-size="12.5" fill="#c3c2b7">
    <text x="256" y="294">a malicious PR hits</text>
    <text x="256" y="312">pull_request_target</text>
    <text x="256" y="330">and leaks the PAT</text>
  </g>

  <rect x="480" y="240" width="200" height="170" rx="10" fill="#2a1f1f" stroke="#e66767" stroke-dasharray="5 4"/>
  <text x="496" y="268" font-size="14" font-weight="700" fill="#ffffff">reviewdog</text>
  <g font-size="12.5" fill="#c3c2b7">
    <text x="496" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e66767">action-setup@v1</text>
    <text x="496" y="312">points to malicious code,</text>
    <text x="496" y="330">18:42 to 20:31 UTC,</text>
    <text x="496" y="348">via a reviewdog PAT</text>
    <text x="496" y="366">leaked from SpotBugs</text>
    <text x="496" y="392" fill="#6b6b66">CVE-2025-30154</text>
  </g>

  <rect x="740" y="240" width="220" height="170" rx="10" fill="#2a1f1f" stroke="#e66767"/>
  <text x="756" y="268" font-size="14" font-weight="700" fill="#ffffff">tj-actions</text>
  <g font-size="12.5" fill="#c3c2b7">
    <text x="756" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e66767">changed-files tags</text>
    <text x="756" y="312">repointed to 0e58ed8</text>
    <text x="756" y="330">target: coinbase/agentkit</text>
    <text x="756" y="392" fill="#6b6b66">CVE-2025-30066</text>
  </g>

  <!-- fallout -->
  <line x1="850" y1="410" x2="850" y2="430" stroke="#e66767" stroke-width="2"/>
  <rect x="660" y="430" width="300" height="44" rx="10" fill="#e66767" fill-opacity="0.12" stroke="#e66767"/>
  <text x="810" y="457" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">used by over 23,000 repositories</text>

  <text x="60" y="466" font-size="12" fill="#6b6b66">Sources: Unit 42, Wiz, GitHub advisories</text>
</svg>
