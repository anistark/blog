<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="system-ui, sans-serif">
  <title>Two dependency chains. Before 2025-04-09, a workflow pins trivy-action by SHA, but trivy-action calls setup-trivy by the v0.2.2 tag, which was hijacked in March 2026. After trivy-action PR 456, it pins setup-trivy by SHA too, so the whole chain stays on the original code</title>
  <rect width="1000" height="500" fill="#1a1a19"/>

  <text x="60" y="58" font-size="22" font-weight="700" fill="#ffffff">Your pin stops at your workflow</text>
  <text x="60" y="86" font-size="15" fill="#c3c2b7">what a SHA-pinned trivy-action ran during the March 2026 setup-trivy tag hijack</text>

  <!-- row labels -->
  <text x="60" y="150" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6b6b66">PINNED TO A COMMIT BEFORE 2025-04-09</text>
  <text x="60" y="330" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6b6b66">PINNED TO A COMMIT AFTER PR #456</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- row 1 -->
    <rect x="60" y="170" width="220" height="80" rx="10" fill="#242423" stroke="#3a3a38"/>
    <text x="80" y="204" font-size="15" font-weight="600" fill="#ffffff">your workflow</text>
    <text x="80" y="228" font-size="12" fill="#c3c2b7">.github/workflows</text>

    <line x1="280" y1="210" x2="390" y2="210" stroke="#199e70" stroke-width="2"/>
    <text x="335" y="198" font-size="12" fill="#199e70" text-anchor="middle">@&lt;sha&gt; ✓</text>

    <rect x="390" y="170" width="220" height="80" rx="10" fill="#1b2b25" stroke="#199e70"/>
    <text x="410" y="204" font-size="15" font-weight="600" fill="#ffffff">trivy-action</text>
    <text x="410" y="228" font-size="12" fill="#c3c2b7">clean</text>

    <line x1="610" y1="210" x2="720" y2="210" stroke="#e66767" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="665" y="198" font-size="12" fill="#e66767" text-anchor="middle">@v0.2.2 ✗</text>

    <rect x="720" y="170" width="220" height="80" rx="10" fill="#2a1f1f" stroke="#e66767" stroke-dasharray="5 4"/>
    <text x="740" y="204" font-size="15" font-weight="600" fill="#ffffff">setup-trivy</text>
    <text x="740" y="228" font-size="12" fill="#e66767">tag force-pushed</text>

    <!-- row 2 -->
    <rect x="60" y="350" width="220" height="80" rx="10" fill="#242423" stroke="#3a3a38"/>
    <text x="80" y="384" font-size="15" font-weight="600" fill="#ffffff">your workflow</text>
    <text x="80" y="408" font-size="12" fill="#c3c2b7">.github/workflows</text>

    <line x1="280" y1="390" x2="390" y2="390" stroke="#199e70" stroke-width="2"/>
    <text x="335" y="378" font-size="12" fill="#199e70" text-anchor="middle">@&lt;sha&gt; ✓</text>

    <rect x="390" y="350" width="220" height="80" rx="10" fill="#1b2b25" stroke="#199e70"/>
    <text x="410" y="384" font-size="15" font-weight="600" fill="#ffffff">trivy-action</text>
    <text x="410" y="408" font-size="12" fill="#c3c2b7">clean</text>

    <line x1="610" y1="390" x2="720" y2="390" stroke="#199e70" stroke-width="2"/>
    <text x="665" y="378" font-size="12" fill="#199e70" text-anchor="middle">@ff1b8b0 ✓</text>

    <rect x="720" y="350" width="220" height="80" rx="10" fill="#1b2b25" stroke="#199e70"/>
    <text x="740" y="384" font-size="15" font-weight="600" fill="#ffffff">setup-trivy</text>
    <text x="740" y="408" font-size="12" fill="#c3c2b7">original v0.2.2 code</text>
  </g>

  <text x="60" y="470" font-size="12" fill="#6b6b66">Source: Trivy advisory GHSA-69fq-xp46-6x23 and trivy-action PR #456</text>
</svg>
