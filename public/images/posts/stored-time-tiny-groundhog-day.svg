<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>A tiny Groundhog Day: a three-step loop from a case, a user session, to your call, a sticky note with a written guess, to the answer, a tick or a cross, with an arrow back to the start. Below it a tally of five ticks and one cross builds up as the loop runs</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <style>
    .runner { opacity: 0; animation: run 12s linear infinite; }
    .token { animation: lap 1.5s linear infinite; }
    .q { opacity: 0; animation: q 12s linear infinite; }
    .tick { animation: tick 12s linear infinite; }
    .cross { opacity: 0; animation: cross 12s linear infinite; }
    .m0 { animation: m0 12s linear infinite; } .m1 { animation: m1 12s linear infinite; } .m2 { animation: m2 12s linear infinite; }
    .m3 { animation: m3 12s linear infinite; } .m4 { animation: m4 12s linear infinite; } .m5 { animation: m5 12s linear infinite; }
    @keyframes run { 0%, 74.5% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes lap { 0.00% { transform: translate(220.0px, 230.0px); } 43.95% { transform: translate(780.0px, 230.0px); } 48.50% { transform: translate(780.0px, 172.0px); } 49.79% { transform: translate(773.2px, 157.4px); } 51.52% { transform: translate(755.0px, 145.3px); } 53.86% { transform: translate(727.0px, 135.0px); } 56.77% { transform: translate(690.9px, 126.6px); } 60.16% { transform: translate(648.3px, 120.0px); } 63.90% { transform: translate(600.8px, 115.3px); } 67.88% { transform: translate(550.2px, 112.4px); } 71.99% { transform: translate(497.9px, 111.2px); } 75.92% { transform: translate(447.8px, 111.9px); } 79.89% { transform: translate(397.2px, 114.3px); } 83.62% { transform: translate(349.9px, 118.5px); } 86.98% { transform: translate(307.5px, 124.5px); } 89.86% { transform: translate(271.7px, 132.2px); } 92.15% { transform: translate(244.1px, 141.7px); } 93.81% { transform: translate(226.3px, 153.0px); } 94.98% { transform: translate(220.0px, 166.0px); } 100.00% { transform: translate(220.0px, 230.0px); } }
    @keyframes q { 0% { opacity: 0; } 0.6% { opacity: 1; } 4.893% { opacity: 1; } 5.493% { opacity: 0; } 12.5% { opacity: 0; } 13.1% { opacity: 1; } 17.393% { opacity: 1; } 17.993% { opacity: 0; } 25% { opacity: 0; } 25.6% { opacity: 1; } 29.893% { opacity: 1; } 30.493% { opacity: 0; } 37.5% { opacity: 0; } 38.1% { opacity: 1; } 42.393% { opacity: 1; } 42.993% { opacity: 0; } 50% { opacity: 0; } 50.6% { opacity: 1; } 54.893% { opacity: 1; } 55.493% { opacity: 0; } 62.5% { opacity: 0; } 63.1% { opacity: 1; } 67.393% { opacity: 1; } 67.993% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes tick { 0% { opacity: 0; } 5.493% { opacity: 0; } 6.093% { opacity: 1; } 11.9% { opacity: 1; } 12.5% { opacity: 0; } 17.993% { opacity: 0; } 18.593% { opacity: 1; } 24.4% { opacity: 1; } 25% { opacity: 0; } 30.493% { opacity: 0; } 31.093% { opacity: 1; } 36.9% { opacity: 1; } 37.5% { opacity: 0; } 55.493% { opacity: 0; } 56.093% { opacity: 1; } 61.9% { opacity: 1; } 62.5% { opacity: 0; } 67.993% { opacity: 0; } 68.593% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes cross { 0% { opacity: 0; } 42.993% { opacity: 0; } 43.593% { opacity: 1; } 49.4% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes m0 { 0% { opacity: 0; } 5.493% { opacity: 0; } 6.093% { opacity: 1; } 96.5% { opacity: 1; } 97.1% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes m1 { 0% { opacity: 0; } 17.993% { opacity: 0; } 18.593% { opacity: 1; } 96.5% { opacity: 1; } 97.1% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes m2 { 0% { opacity: 0; } 30.493% { opacity: 0; } 31.093% { opacity: 1; } 96.5% { opacity: 1; } 97.1% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes m3 { 0% { opacity: 0; } 42.993% { opacity: 0; } 43.593% { opacity: 1; } 96.5% { opacity: 1; } 97.1% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes m4 { 0% { opacity: 0; } 55.493% { opacity: 0; } 56.093% { opacity: 1; } 96.5% { opacity: 1; } 97.1% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes m5 { 0% { opacity: 0; } 67.993% { opacity: 0; } 68.593% { opacity: 1; } 96.5% { opacity: 1; } 97.1% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c212b"/><stop offset="1" stop-color="#14181f"/></linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc964"/><stop offset="1" stop-color="#eaa83a"/></linearGradient>
  </defs>

  <rect width="1000" height="470" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="470" rx="20" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="999" height="469" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">A TINY GROUNDHOG DAY</text>

  <!-- connectors -->
  <g fill="none" stroke="#3a4152" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="314" y1="230" x2="426" y2="230"/><path d="M419 223 L427 230 L419 237"/>
    <line x1="574" y1="230" x2="716" y2="230"/><path d="M709 223 L717 230 L709 237"/>
    <path d="M780 172 C780 92 220 92 220 165"/><path d="M213 158 L220 166 L227 158"/>
  </g>
  <text x="500" y="99" font-size="12" fill="#7d8597" text-anchor="middle">and again</text>

  <!-- the token running the loop -->
  <g class="runner"><circle class="token" r="5" fill="#f5b544" filter="url(#glow)"/></g>

  <!-- 1. a case: a user session -->
  <g>
    <rect x="140" y="175" width="160" height="110" rx="10" fill="url(#panel)" stroke="#3a4152" stroke-width="1.5"/>
    <line x1="140" y1="195" x2="300" y2="195" stroke="#3a4152"/>
    <g fill="#3a4152"><circle cx="154" cy="185" r="2.5"/><circle cx="164" cy="185" r="2.5"/><circle cx="174" cy="185" r="2.5"/></g>
    <g stroke="#7d8597" stroke-width="1.5"><line x1="170" y1="215" x2="270" y2="215"/></g>
    <g stroke="#c5cad6" stroke-width="1.5"><circle cx="170" cy="215" r="5" fill="#c5cad6"/><circle cx="220" cy="215" r="5" fill="#c5cad6"/><circle cx="270" cy="215" r="5" fill="#161a22"/></g>
    <rect x="156" y="234" width="104" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="156" y="248" width="72" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="232" y="263" width="52" height="13" rx="6.5" fill="none" stroke="#7d8597" stroke-width="1.5"/>
    <path d="M262 252 L262 270 L267 265 L271 273 L274 271.5 L270 263.5 L276.5 263.5 Z" fill="#eef1f6" stroke="#12151c" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- 2. your call: a sticky note -->
  <g transform="rotate(-3 500 230)">
    <rect x="444" y="180" width="120" height="120" rx="4" fill="#000000" fill-opacity="0.55" filter="url(#shadow)"/>
    <path d="M440 170 H560 V268 L538 290 H440 Z" fill="url(#note)"/>
    <path d="M538 290 V274 Q538 268 544 268 H560 Z" fill="#b97f1f"/>
    <text x="454" y="202" font-size="14" font-weight="700" fill="#1b1d22">drops at</text>
    <text x="454" y="222" font-size="14" font-weight="700" fill="#1b1d22">step 3</text>
    <text x="454" y="268" font-size="24" font-weight="700" fill="#1b1d22">70%</text>
  </g>

  <!-- 3. the answer -->
  <g>
    <circle cx="780" cy="230" r="52" fill="url(#panel)" stroke="#3a4152" stroke-width="2"/>
    <text class="q" x="780" y="241" font-size="30" font-weight="700" fill="#7d8597" text-anchor="middle">?</text>
    <path class="tick" d="M760 231 L774 245 L801 216" fill="none" stroke="#5ad08a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="cross" d="M764 214 L796 246 M796 214 L764 246" fill="none" stroke="#f2676b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- labels -->
  <g text-anchor="middle">
    <text x="220" y="328" font-size="14" font-weight="700" fill="#eef1f6">a case</text>
    <text x="220" y="348" font-size="12" fill="#7d8597">a user session</text>
    <text x="500" y="328" font-size="14" font-weight="700" fill="#eef1f6">your call</text>
    <text x="500" y="348" font-size="12" fill="#7d8597">written down first</text>
    <text x="780" y="328" font-size="14" font-weight="700" fill="#eef1f6">the answer</text>
    <text x="780" y="348" font-size="12" fill="#7d8597">inside a minute</text>
  </g>

  <!-- tally -->
  <line x1="48" y1="378" x2="952" y2="378" stroke="#232834"/>
  <text x="352" y="415" font-size="12" letter-spacing="1.2" fill="#7d8597" text-anchor="end">TALLY</text>
  <g fill="#ffffff" fill-opacity="0.03" stroke="#232834">
    <rect x="364" y="394" width="32" height="32" rx="7"/><rect x="412" y="394" width="32" height="32" rx="7"/><rect x="460" y="394" width="32" height="32" rx="7"/>
    <rect x="508" y="394" width="32" height="32" rx="7"/><rect x="556" y="394" width="32" height="32" rx="7"/><rect x="604" y="394" width="32" height="32" rx="7"/>
  </g>
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="m0" d="M373 410 L378 415 L388 404" stroke="#5ad08a"/>
    <path class="m1" d="M421 410 L426 415 L436 404" stroke="#5ad08a"/>
    <path class="m2" d="M469 410 L474 415 L484 404" stroke="#5ad08a"/>
    <path class="m3" d="M518 404 L530 416 M530 404 L518 416" stroke="#f2676b"/>
    <path class="m4" d="M565 410 L570 415 L580 404" stroke="#5ad08a"/>
    <path class="m5" d="M613 410 L618 415 L628 404" stroke="#5ad08a"/>
  </g>
</svg>
