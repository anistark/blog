<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c3aed" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aBlue" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#60a5fa"/>
    </marker>
    <marker id="aGreen" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="318" r="250" fill="#7c3aed" opacity="0.16" filter="url(#glow)"/>
  <circle cx="175" cy="375" r="150" fill="#3b82f6" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1010" cy="375" r="150" fill="#10b981" opacity="0.10" filter="url(#glow)"/>

  <!-- wordmark -->
  <text x="600" y="182" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="68" font-weight="700" fill="url(#wm)" filter="url(#glow)">Orion</text>
  <text x="600" y="220" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#94a3b8">Agent Harness for local models</text>

  <!-- BACKENDS -->
  <text x="170" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" letter-spacing="3" fill="#60a5fa">BACKENDS</text>
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="16" fill="#dbeafe">
    <rect x="95" y="322" width="150" height="34" rx="8" fill="#0d1626" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="170" y="344" text-anchor="middle">llama.cpp</text>
    <rect x="95" y="362" width="150" height="34" rx="8" fill="#0d1626" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="170" y="384" text-anchor="middle">MLX</text>
    <rect x="95" y="402" width="150" height="34" rx="8" fill="#0d1626" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="170" y="424" text-anchor="middle">cloud API</text>
  </g>
  <g stroke="#60a5fa" stroke-width="1.6" stroke-opacity="0.7" fill="none">
    <path d="M245 339 L420 373"/>
    <path d="M245 379 L420 375"/>
    <path d="M245 419 L420 377"/>
    <circle cx="424" cy="375" r="4" fill="#60a5fa" stroke="none"/>
    <path d="M432 375 L500 375" marker-end="url(#aBlue)"/>
  </g>

  <!-- core: Orion mark (compass north-star) -->
  <g transform="translate(600 375)" filter="url(#glow)">
    <!-- broken compass ring: four arcs with cardinal gaps -->
    <g fill="none" stroke="#c4b5fd" stroke-width="13">
      <path d="M15.5,-67.2 A69 69 0 0 1 67.2,-15.5"/>
      <path d="M67.2,15.5 A69 69 0 0 1 15.5,67.2"/>
      <path d="M-15.5,67.2 A69 69 0 0 1 -67.2,15.5"/>
      <path d="M-67.2,-15.5 A69 69 0 0 1 -15.5,-67.2"/>
    </g>
    <!-- four-point north star with concave edges -->
    <path d="M0,-84 Q0,0 84,0 Q0,0 0,84 Q0,0 -84,0 Q0,0 0,-84 Z" fill="#ede9fe"/>
    <!-- cardinal dots -->
    <g fill="#ede9fe">
      <circle cx="0" cy="-92" r="6"/>
      <circle cx="92" cy="0" r="6"/>
      <circle cx="0" cy="92" r="6"/>
      <circle cx="-92" cy="0" r="6"/>
    </g>
  </g>
  <text x="600" y="505" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#a78bfa">loop · context · templates · tools</text>

  <!-- out to app -->
  <g stroke="#34d399" stroke-width="1.6" stroke-opacity="0.75" fill="none">
    <path d="M700 375 L900 375" marker-end="url(#aGreen)"/>
  </g>

  <!-- YOUR APP -->
  <text x="1012" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" letter-spacing="3" fill="#34d399">YOUR APP</text>
  <rect x="905" y="322" width="214" height="150" rx="12" fill="#0b1a14" stroke="#10b981" stroke-opacity="0.5"/>
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13">
    <text x="924" y="352" fill="#6ee7b7">events</text>
    <rect x="924" y="364" width="120" height="24" rx="6" fill="#0f2e1f" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="934" y="381" fill="#d1fae5">MessageDelta</text>
    <rect x="924" y="394" width="96" height="24" rx="6" fill="#1e1633" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="934" y="411" fill="#ede9fe">ToolExec</text>
    <rect x="924" y="424" width="128" height="24" rx="6" fill="#0d1626" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text x="934" y="441" fill="#dbeafe">ContextBudget</text>
  </g>
</svg>
