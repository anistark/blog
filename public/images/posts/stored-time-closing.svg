<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>The jar from the opening sits on its shelf, now empty. Beside it a batsman waits at the crease, mid-decision, with a warm glow in their chest. The time is no longer in the jar, it is in them. The last spark drifts out of the jar and settles into that glow</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <style>
    .traveller { opacity: 0; animation: travel 12s linear infinite; }
    .chest { transform-box: fill-box; transform-origin: 50% 50%; animation: chest 12s ease-in-out infinite; }
    @keyframes travel {
      0% { transform: translate(-386px, 66px); opacity: 0; }
      4%, 14% { transform: translate(-386px, 66px); opacity: 1; }
      26% { transform: translate(-386px, -172px); opacity: 1; }
      31% { transform: translate(-352px, -214px); opacity: 1; }
      36% { transform: translate(-290px, -236px); opacity: 1; }
      41% { transform: translate(-212px, -232px); opacity: 1; }
      46% { transform: translate(-130px, -196px); opacity: 1; }
      51% { transform: translate(-56px, -112px); opacity: 1; }
      56% { transform: translate(0px, 0px); opacity: 1; }
      60%, 100% { transform: translate(0px, 0px); opacity: 0; }
    }
    @keyframes chest {
      0%, 50% { transform: scale(0.55); opacity: 0.3; }
      60% { transform: scale(1.2); opacity: 1; }
      66%, 90% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.55); opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="warm" cx="676" cy="320" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f5b544" stop-opacity="0.10"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/><stop offset="0.35" stop-color="#ffffff" stop-opacity="0.03"/><stop offset="0.8" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b3b2d"/><stop offset="1" stop-color="#2a2119"/></linearGradient>
    <linearGradient id="wall-shadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000000" stop-opacity="0.45"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient>
    <linearGradient id="figure" x1="0" y1="210" x2="0" y2="500" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4c5466"/><stop offset="1" stop-color="#252a34"/></linearGradient>
    <linearGradient id="pad" x1="0" y1="410" x2="0" y2="490" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6a7284"/><stop offset="1" stop-color="#3c4250"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a7356"/><stop offset="1" stop-color="#5a4936"/></linearGradient>
    <radialGradient id="spark-halo"><stop offset="0" stop-color="#f5b544" stop-opacity="0.9"/><stop offset="0.4" stop-color="#f5b544" stop-opacity="0.35"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1000" height="560" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="560" rx="20" fill="url(#sheen)"/>
  <rect width="1000" height="560" rx="20" fill="url(#warm)"/>
  <rect x="0.5" y="0.5" width="999" height="559" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">STORED TIME, IN A PERSON</text>

  <!-- shelf -->
  <rect x="150" y="394" width="280" height="30" fill="url(#wall-shadow)"/>
  <g stroke="#3a4152" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M196 396 V430 M196 425 L228 396"/>
    <path d="M384 396 V430 M384 425 L352 396"/>
  </g>
  <rect x="150" y="380" width="280" height="14" rx="2" fill="url(#wood)"/>
  <path d="M158 386 C220 384 300 389 422 386" fill="none" stroke="#000000" stroke-opacity="0.28"/>
  <line x1="150" y1="380.5" x2="430" y2="380.5" stroke="#ffffff" stroke-opacity="0.16"/>
  <ellipse cx="290" cy="381" rx="90" ry="3.5" fill="#000000" fill-opacity="0.5"/>

  <!-- the jar, now empty (same jar as the opening, at 0.65 scale) -->
  <g transform="translate(-35 75.8) scale(0.65)">
    <path d="M418 148 V168 C418 190 372 192 372 222 V438 Q372 468 402 468 H598 Q628 468 628 438 V222 C628 192 582 190 582 168 V148" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.6"/>
    <rect x="410" y="126" width="180" height="22" rx="6" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.6"/>
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"><line x1="416" y1="134" x2="584" y2="134"/><line x1="416" y1="140" x2="584" y2="140"/></g>
    <path d="M387 232 V424" stroke="url(#hl)" stroke-width="4" stroke-linecap="round"/>
    <path d="M396 200 C404 195 412 192 418 186" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <path d="M614 250 V300" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
    <g transform="rotate(-1.5 500 398)">
      <rect x="426" y="378" width="148" height="44" rx="5" fill="#ece4d2" fill-opacity="0.95"/>
      <rect x="431" y="383" width="138" height="34" rx="3" fill="none" stroke="#1b1d22" stroke-opacity="0.25" stroke-width="1.5"/>
      <text x="500" y="407" text-anchor="middle" font-size="21" font-weight="700" fill="#1b1d22">10 years</text>
    </g>
  </g>

  <!-- ground and crease -->
  <line x1="500" y1="500.5" x2="940" y2="500.5" stroke="#232834"/>
  <line x1="560" y1="500.5" x2="860" y2="500.5" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <ellipse cx="680" cy="501" rx="96" ry="6" fill="#000000" fill-opacity="0.55"/>

  <!-- stumps -->
  <g stroke="#c5cad6" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round">
    <line x1="788" y1="418" x2="788" y2="499"/><line x1="800" y1="418" x2="800" y2="499"/><line x1="812" y1="418" x2="812" y2="499"/>
    <line x1="787" y1="413" x2="799" y2="413" stroke-width="2.5"/><line x1="801" y1="413" x2="813" y2="413" stroke-width="2.5"/>
  </g>

  <!-- batsman at the crease, side-on, watching down the pitch (left) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <g fill="none" stroke="url(#figure)" stroke-width="22">
      <path d="M664 362 L648 426 L638 486"/>
      <path d="M696 362 L710 426 L720 486"/>
    </g>
    <!-- pads -->
    <g fill="none" stroke="url(#pad)" stroke-width="25">
      <path d="M647 424 L638 482"/>
      <path d="M711 424 L719 482"/>
    </g>
    <g fill="none" stroke="#12151c" stroke-opacity="0.35" stroke-width="1.5">
      <path d="M644 436 h9 M642 450 h9 M640 464 h9"/>
      <path d="M708 436 h9 M710 450 h9 M712 464 h9"/>
    </g>
    <!-- shoes -->
    <ellipse cx="632" cy="494" rx="17" ry="6.5" fill="#2c313c"/>
    <ellipse cx="726" cy="494" rx="15" ry="6.5" fill="#2c313c"/>
    <!-- torso -->
    <path d="M648 268 Q676 256 708 268 L702 360 Q680 370 658 360 Z" fill="url(#figure)" stroke="#ffffff" stroke-opacity="0.07"/>
    <!-- glow in the chest -->
    <g class="chest">
      <circle cx="676" cy="302" r="46" fill="#f5b544" fill-opacity="0.35" filter="url(#soft)"/>
      <circle cx="676" cy="302" r="22" fill="url(#spark-halo)"/>
      <circle cx="676" cy="302" r="5" fill="#fff4d6" filter="url(#glow)"/>
    </g>
    <!-- arms -->
    <g fill="none" stroke="url(#figure)" stroke-width="15">
      <path d="M655 276 L640 318 L666 344"/>
      <path d="M701 276 L696 320 L674 344"/>
    </g>
    <!-- bat -->
    <line x1="670" y1="336" x2="674" y2="384" stroke="#2c313c" stroke-width="7"/>
    <rect x="666" y="380" width="17" height="112" rx="5" fill="url(#blade)" transform="rotate(2 674 436)"/>
    <line x1="669" y1="388" x2="671" y2="486" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="670" cy="342" r="9.5" fill="#3f4656"/>
    <!-- head and helmet, peak facing down the pitch -->
    <path d="M697 236 A21 21 0 1 0 655 236 Z" fill="url(#figure)" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M657 234 L640 239 L657 241 Z" fill="#4c5466"/>
    <path d="M659 242 Q660 254 670 258 L690 256 Q694 248 696 238 Z" fill="#2f3542"/>
    <g stroke="#12151c" stroke-opacity="0.6" stroke-width="1.5"><line x1="662" y1="244" x2="664" y2="255"/><line x1="668" y1="245" x2="669" y2="257"/></g>
    <line x1="676" y1="257" x2="677" y2="266" stroke="url(#figure)" stroke-width="10"/>
  </g>

  <!-- the last spark leaving the jar -->
  <g class="traveller" filter="url(#glow)">
    <circle cx="676" cy="302" r="14" fill="url(#spark-halo)"/>
    <path d="M676 293 V311 M667 302 H685" stroke="#f5b544" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="676" cy="302" r="3.5" fill="#fff4d6"/>
  </g>
</svg>
