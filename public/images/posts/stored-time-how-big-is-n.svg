<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>Five rising steps showing how many tries different skills took: about 50 cards in the gambling task, about 250 scored drills in an hour of cockpit instrument reading, about 250 operations in surgery, over 10,000 hours for elite violinists, and 832 to 24,284 hours for chess grandmasters, drawn as a wide bar to show the spread</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.01"/></linearGradient>
    <linearGradient id="step-hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5b544" stop-opacity="0.12"/><stop offset="1" stop-color="#f5b544" stop-opacity="0.01"/></linearGradient>
    <linearGradient id="spread" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5b544" stop-opacity="0.35"/><stop offset="1" stop-color="#f5b544" stop-opacity="1"/></linearGradient>
  </defs>

  <rect width="1000" height="480" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="480" rx="20" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="999" height="479" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">HOW BIG IS N?</text>

  <!-- staircase -->
  <rect x="48" y="392" width="150" height="38" fill="url(#step)"/>
  <rect x="198" y="348" width="150" height="82" fill="url(#step)"/>
  <rect x="348" y="304" width="150" height="126" fill="url(#step)"/>
  <rect x="498" y="260" width="150" height="170" fill="url(#step)"/>
  <rect x="648" y="216" width="304" height="214" fill="url(#step-hot)"/>
  <path d="M48 430 V392 H198 V348 H348 V304 H498 V260 H648 V216 H952 V430 Z" fill="none" stroke="#232834" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#232834" stroke-width="1" stroke-dasharray="2 4">
    <line x1="198" y1="392" x2="198" y2="430"/><line x1="348" y1="348" x2="348" y2="430"/>
    <line x1="498" y1="304" x2="498" y2="430"/><line x1="648" y1="260" x2="648" y2="430"/>
  </g>
  <g stroke="#c5cad6" stroke-width="2" stroke-linecap="round">
    <line x1="49" y1="392" x2="197" y2="392"/><line x1="199" y1="348" x2="347" y2="348"/>
    <line x1="349" y1="304" x2="497" y2="304"/><line x1="499" y1="260" x2="647" y2="260"/>
  </g>
  <line x1="649" y1="216" x2="951" y2="216" stroke="#f5b544" stroke-width="2" stroke-linecap="round"/>

  <!-- icons -->
  <g fill="none" stroke="#c5cad6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- cards -->
    <g transform="translate(78 288)">
      <rect x="-12" y="-13" width="17" height="24" rx="3" transform="rotate(-12)"/>
      <rect x="-4" y="-12" width="17" height="24" rx="3" transform="rotate(10)" fill="#141821"/>
      <path d="M5.5 -5 l3.5 4.5 -3.5 4.5 -3.5 -4.5 z" transform="rotate(10)" stroke="#eef1f6"/>
    </g>
    <!-- cockpit gauge -->
    <g transform="translate(230 244)">
      <circle r="14"/>
      <path d="M-9 7 A11.5 11.5 0 1 1 9 7" stroke-opacity="0.5" stroke-dasharray="1.5 3.5"/>
      <path d="M0 0 L7 -8" stroke="#eef1f6"/>
      <circle r="2" fill="#c5cad6"/>
    </g>
    <!-- scalpel -->
    <g transform="translate(380 200)">
      <path d="M-13 12 L-2 1" stroke-width="3.5"/>
      <path d="M-2 1 L10 -12 C14 -8 9 -1 2 4 Z" fill="#141821" stroke="#eef1f6"/>
    </g>
    <!-- violin -->
    <g transform="translate(530 157)">
      <path d="M0 -9 C6 -9 7 -4 4 -1 C9 1 10 8 6 12 C3 16 -3 16 -6 12 C-10 8 -9 1 -4 -1 C-7 -4 -6 -9 0 -9 Z" fill="#141821" stroke="#eef1f6"/>
      <path d="M0 -9 V-17"/><circle cx="0" cy="-18.5" r="1.5"/>
      <path d="M-2 3 v4 M2 3 v4" stroke-opacity="0.6"/>
      <path d="M12 15 L17 -15" stroke-opacity="0.55"/>
    </g>
    <!-- pawn -->
    <g transform="translate(680 112)">
      <circle cy="-8" r="5" stroke="#f5b544"/>
      <path d="M-5 9 L-3 -2 H3 L5 9 Z" stroke="#f5b544"/>
      <path d="M-9 12 H9" stroke="#f5b544"/>
    </g>
  </g>

  <!-- labels -->
  <g>
    <text x="64" y="334" font-size="26" font-weight="700" fill="#eef1f6">~50</text>
    <text x="64" y="356" font-size="13" fill="#c5cad6">cards</text>
    <text x="64" y="376" font-size="12" fill="#7d8597">gambling task</text>

    <text x="214" y="290" font-size="26" font-weight="700" fill="#eef1f6">~250</text>
    <text x="214" y="312" font-size="13" fill="#c5cad6">drills · 1 hour</text>
    <text x="214" y="332" font-size="12" fill="#7d8597">cockpit gauges</text>

    <text x="364" y="246" font-size="26" font-weight="700" fill="#eef1f6">~250</text>
    <text x="364" y="268" font-size="13" fill="#c5cad6">operations</text>
    <text x="364" y="288" font-size="12" fill="#7d8597">prostate surgery</text>

    <text x="514" y="202" font-size="26" font-weight="700" fill="#eef1f6">10,000+</text>
    <text x="514" y="224" font-size="13" fill="#c5cad6">hours by age 20</text>
    <text x="514" y="244" font-size="12" fill="#7d8597">elite violinists</text>

    <text x="664" y="158" font-size="26" font-weight="700" fill="#eef1f6">832 to 24,284</text>
    <text x="664" y="180" font-size="13" fill="#c5cad6">hours</text>
    <text x="664" y="200" font-size="12" fill="#7d8597">chess grandmasters</text>
  </g>

  <!-- the spread, as a wide bar -->
  <line x1="664" y1="252" x2="928" y2="252" stroke="#232834" stroke-width="10" stroke-linecap="round"/>
  <rect x="673" y="247" width="255" height="10" rx="5" fill="url(#spread)" filter="url(#glow)"/>
  <g stroke="#7d8597" stroke-width="1.5" stroke-linecap="round"><line x1="673" y1="262" x2="673" y2="268"/><line x1="928" y1="262" x2="928" y2="268"/></g>
  <text x="667" y="286" font-size="12" fill="#7d8597">832</text>
  <text x="934" y="286" font-size="12" fill="#7d8597" text-anchor="end">24,284</text>
  <text x="664" y="330" font-size="20" font-weight="700" fill="#f5b544">≈ 30× spread</text>
  <text x="664" y="352" font-size="12" fill="#7d8597">between grandmasters</text>

  <text x="48" y="460" font-size="12" fill="#7d8597">units differ, so these are steps, not a scale</text>
</svg>
