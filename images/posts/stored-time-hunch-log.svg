<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>A page from a hunch log: a ruled notebook page with columns for date, the call, confidence, cue I noticed, check on, what happened and score. The first row reads Nov 09, this onboarding change will lift day-one completion, 70%, users kept stalling on the permissions screen, check on Nov 23, with what happened and score still blank, followed by empty rows</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="page" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#1b1f29"/><stop offset="1" stop-color="#14171e"/></linearGradient>
    <linearGradient id="page-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/></linearGradient>
  </defs>

  <rect width="1000" height="500" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="500" rx="20" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="999" height="499" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">A PAGE FROM A HUNCH LOG</text>

  <!-- the page -->
  <rect x="56" y="84" width="896" height="392" rx="12" fill="#000000" fill-opacity="0.6" filter="url(#shadow)"/>
  <rect x="48" y="72" width="904" height="396" rx="12" fill="url(#page)" stroke="#ffffff" stroke-opacity="0.09"/>
  <rect x="48" y="72" width="904" height="396" rx="12" fill="url(#page-sheen)"/>

  <!-- ruled lines -->
  <g stroke="#263046" stroke-width="1">
    <line x1="48" y1="174" x2="952" y2="174"/><line x1="48" y1="200" x2="952" y2="200"/>
    <line x1="48" y1="252" x2="952" y2="252"/><line x1="48" y1="278" x2="952" y2="278"/>
    <line x1="48" y1="330" x2="952" y2="330"/><line x1="48" y1="356" x2="952" y2="356"/>
    <line x1="48" y1="408" x2="952" y2="408"/><line x1="48" y1="434" x2="952" y2="434"/>
  </g>
  <g stroke="#33405c" stroke-width="1.5">
    <line x1="48" y1="226" x2="952" y2="226"/><line x1="48" y1="304" x2="952" y2="304"/><line x1="48" y1="382" x2="952" y2="382"/>
  </g>
  <line x1="104" y1="148" x2="952" y2="148" stroke="#4a5670" stroke-width="1.5"/>

  <!-- column rules -->
  <g stroke="#232834" stroke-width="1">
    <line x1="200" y1="124" x2="200" y2="460"/><line x1="406" y1="124" x2="406" y2="460"/><line x1="502" y1="124" x2="502" y2="460"/>
    <line x1="700" y1="124" x2="700" y2="460"/><line x1="784" y1="124" x2="784" y2="460"/><line x1="894" y1="124" x2="894" y2="460"/>
  </g>

  <!-- margin and binding holes -->
  <line x1="104" y1="72" x2="104" y2="468" stroke="#f2676b" stroke-opacity="0.45" stroke-width="1.5"/>
  <g fill="#0a0c10" stroke="#2c3240" stroke-width="1.5">
    <circle cx="76" cy="122" r="7"/><circle cx="76" cy="222" r="7"/><circle cx="76" cy="322" r="7"/><circle cx="76" cy="422" r="7"/>
  </g>

  <!-- page header -->
  <text x="120" y="106" font-size="14" font-weight="700" fill="#eef1f6">Hunch log</text>
  <text x="932" y="106" font-size="12" fill="#7d8597" text-anchor="end">p. 14</text>

  <!-- column headers -->
  <g font-size="12" font-weight="700" fill="#c5cad6">
    <text x="120" y="141">Date</text>
    <text x="208" y="141">The call</text>
    <text x="414" y="141">Confidence</text>
    <text x="510" y="141">Cue I noticed</text>
    <text x="708" y="141">Check on</text>
    <text x="792" y="141">What happened</text>
    <text x="902" y="141">Score</text>
  </g>

  <!-- the example entry -->
  <g font-size="13">
    <text x="120" y="168" fill="#c5cad6">Nov 09</text>
    <text x="208" y="168" fill="#eef1f6">This onboarding change</text>
    <text x="208" y="194" fill="#eef1f6">will lift day-one</text>
    <text x="208" y="220" fill="#eef1f6">completion.</text>
    <text x="414" y="169" font-size="18" font-weight="700" fill="#f5b544">70%</text>
    <text x="510" y="168" fill="#c5cad6">Users kept stalling on</text>
    <text x="510" y="194" fill="#c5cad6">the permissions</text>
    <text x="510" y="220" fill="#c5cad6">screen.</text>
    <text x="708" y="168" fill="#c5cad6">Nov 23</text>
    <text x="708" y="194" font-size="12" fill="#7d8597">2 weeks</text>
  </g>
</svg>
