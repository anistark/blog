<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="system-ui, sans-serif">
  <title>Decision tree of a skill's five outcomes: followed, loaded then ignored, undertrigger, correctly quiet, overtrigger</title>
  <rect width="1000" height="600" fill="#1a1a19"/>

  <text x="60" y="52" font-size="20" font-weight="700" fill="#ffffff">Two questions, five outcomes</text>
  <text x="60" y="78" font-size="14" fill="#c3c2b7">a skill has to load at the right moment, and then actually be followed</text>

  <!-- connectors -->
  <g stroke="#3a3a38" stroke-width="2" fill="none">
    <path d="M 500 158 L 500 176 L 290 176 L 290 196"/>
    <path d="M 500 176 L 710 176 L 710 196"/>
    <path d="M 290 246 L 290 266 L 170 266 L 170 288"/>
    <path d="M 290 266 L 410 266 L 410 288"/>
    <path d="M 710 246 L 710 266 L 600 266 L 600 288"/>
    <path d="M 710 266 L 830 266 L 830 288"/>
    <path d="M 170 338 L 170 360 L 90 360 L 90 384"/>
    <path d="M 170 360 L 250 360 L 250 384"/>
  </g>

  <!-- root -->
  <rect x="410" y="108" width="180" height="50" rx="9" fill="#242423" stroke="#3987e5"/>
  <text x="500" y="139" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">a request arrives</text>

  <!-- level 1 -->
  <rect x="195" y="196" width="190" height="50" rx="9" fill="#242423" stroke="#3a3a38"/>
  <text x="290" y="227" font-size="14" fill="#ffffff" text-anchor="middle">the skill is relevant</text>
  <rect x="615" y="196" width="190" height="50" rx="9" fill="#242423" stroke="#3a3a38"/>
  <text x="710" y="227" font-size="14" fill="#ffffff" text-anchor="middle">the skill is not relevant</text>

  <!-- level 2 -->
  <rect x="95" y="288" width="150" height="50" rx="9" fill="#242423" stroke="#3a3a38"/>
  <text x="170" y="319" font-size="14" fill="#ffffff" text-anchor="middle">it loads</text>

  <rect x="330" y="288" width="160" height="50" rx="9" fill="#2a1f1f" stroke="#e66767" stroke-dasharray="5 4"/>
  <text x="410" y="312" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">✗ never loads</text>
  <text x="410" y="329" font-size="12" fill="#c3c2b7" text-anchor="middle">undertrigger</text>

  <rect x="520" y="288" width="160" height="50" rx="9" fill="#1b2b25" stroke="#199e70"/>
  <text x="600" y="312" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">✓ stays quiet</text>
  <text x="600" y="329" font-size="12" fill="#c3c2b7" text-anchor="middle">correct</text>

  <rect x="750" y="288" width="160" height="50" rx="9" fill="#2a1f1f" stroke="#e66767" stroke-dasharray="5 4"/>
  <text x="830" y="312" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">✗ loads anyway</text>
  <text x="830" y="329" font-size="12" fill="#c3c2b7" text-anchor="middle">overtrigger</text>

  <!-- level 3 -->
  <rect x="20" y="384" width="140" height="50" rx="9" fill="#1b2b25" stroke="#199e70"/>
  <text x="90" y="408" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">✓ followed</text>
  <text x="90" y="425" font-size="12" fill="#c3c2b7" text-anchor="middle">what you wanted</text>

  <rect x="180" y="384" width="140" height="50" rx="9" fill="#2a1f1f" stroke="#e66767" stroke-dasharray="5 4"/>
  <text x="250" y="408" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">✗ loaded, ignored</text>
  <text x="250" y="425" font-size="12" fill="#c3c2b7" text-anchor="middle">execution failure</text>

  <!-- brackets -->
  <g stroke="#3987e5" stroke-width="1.5" fill="none">
    <path d="M 95 470 L 95 480 L 910 480 L 910 470"/>
    <path d="M 20 530 L 20 540 L 320 540 L 320 530"/>
  </g>
  <text x="502" y="504" font-size="14" font-weight="600" fill="#3987e5" text-anchor="middle">trigger rate: did it load exactly when it should have?</text>
  <text x="170" y="564" font-size="14" font-weight="600" fill="#3987e5" text-anchor="middle">pass rate: did it work once loaded?</text>
  <text x="940" y="564" font-size="12" fill="#6b6b66" text-anchor="end">✓ correct   ✗ failure (dashed)</text>
</svg>
