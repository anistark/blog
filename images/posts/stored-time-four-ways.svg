<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>Four ways to store time, left to right: an hourglass for more hours (Time-Turner), a stone bowl for an archive (Pensieve), a plug for know-how (The Matrix), and a loop arrow for what the hours taught (Edge of Tomorrow, Groundhog Day). The first three fade to grey; only the loop arrow is lit</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <style>
    .c1, .c2, .c3 { color: #5a6273; }
    .c1 { animation: c1 10s ease-in-out infinite; }
    .c2 { animation: c2 10s ease-in-out infinite; }
    .c3 { animation: c3 10s ease-in-out infinite; }
    @keyframes c1 { 0%, 12% { color: #c5cad6; } 20%, 94% { color: #5a6273; } 100% { color: #c5cad6; } }
    @keyframes c2 { 0%, 26% { color: #c5cad6; } 34%, 94% { color: #5a6273; } 100% { color: #c5cad6; } }
    @keyframes c3 { 0%, 40% { color: #c5cad6; } 48%, 94% { color: #5a6273; } 100% { color: #c5cad6; } }
    .spin { transform-box: view-box; transform-origin: 846.5px 182px; animation: spin 10s linear infinite; }
    @keyframes spin { 0%, 50% { transform: rotate(0deg); } 100% { transform: rotate(720deg); } }
    .lit { animation: lit 10s ease-in-out infinite; }
    @keyframes lit { 0%, 46% { opacity: 0.35; } 54%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.045"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.012"/></linearGradient>
    <linearGradient id="panel-lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5b544" stop-opacity="0.10"/><stop offset="1" stop-color="#f5b544" stop-opacity="0.02"/></linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#f5b544"/></marker>
  </defs>

  <rect width="1000" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="400" rx="20" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="999" height="399" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">FOUR WAYS TO STORE TIME</text>

  <!-- cards -->
  <g stroke="#ffffff" stroke-opacity="0.08">
    <rect x="48" y="76" width="211" height="290" rx="14" fill="url(#panel)"/>
    <rect x="279" y="76" width="211" height="290" rx="14" fill="url(#panel)"/>
    <rect x="510" y="76" width="211" height="290" rx="14" fill="url(#panel)"/>
  </g>
  <rect x="741" y="76" width="211" height="290" rx="14" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.08"/>
  <g class="lit">
    <rect x="741" y="76" width="211" height="290" rx="14" fill="url(#panel-lit)" stroke="#f5b544" stroke-opacity="0.45"/>
  </g>

  <!-- 1. hourglass: more hours -->
  <g class="c1">
    <g transform="translate(153.5 182)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-30" y="-50" width="60" height="7" rx="3.5"/>
      <rect x="-30" y="43" width="60" height="7" rx="3.5"/>
      <path d="M-22 -43 C-22 -14 -4 -8 -2 0 C-4 8 -22 14 -22 43 H22 C22 14 4 8 2 0 C4 -8 22 -14 22 -43 Z"/>
      <path d="M-15 -27 C-13 -15 -3 -8 -1 -3 H1 C3 -8 13 -15 15 -27 Z" fill="currentColor" fill-opacity="0.35" stroke="none"/>
      <path d="M-18 39 C-12 27 -4 25 0 24 C4 25 12 27 18 39 Z" fill="currentColor" fill-opacity="0.35" stroke="none"/>
    </g>
    <text x="153.5" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">More hours</text>
    <text x="153.5" y="318" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.85">Time-Turner</text>
  </g>

  <!-- 2. stone bowl: an archive -->
  <g class="c2">
    <g transform="translate(384.5 182)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-46 14 C-44 38 -22 46 -10 46 H10 C22 46 44 38 46 14" fill="currentColor" fill-opacity="0.12"/>
      <ellipse cx="0" cy="14" rx="46" ry="10"/>
      <path d="M-12 46 L-16 54 H16 L12 46"/>
      <path d="M-14 8 C-20 -8 -6 -18 -14 -36"/>
      <path d="M2 6 C8 -12 -4 -24 4 -46"/>
      <path d="M18 8 C14 -6 24 -16 18 -30"/>
    </g>
    <text x="384.5" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">An archive</text>
    <text x="384.5" y="318" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.85">Pensieve</text>
  </g>

  <!-- 3. plug: know-how -->
  <g class="c3">
    <g transform="translate(615.5 182)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-12" y="-50" width="7" height="24" rx="2"/>
      <rect x="5" y="-50" width="7" height="24" rx="2"/>
      <path d="M-24 -26 H24 V-4 C24 10 12 18 0 18 C-12 18 -24 10 -24 -4 Z" fill="currentColor" fill-opacity="0.12"/>
      <path d="M0 18 V28 C0 44 -26 36 -26 52"/>
    </g>
    <text x="615.5" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">Know-how</text>
    <text x="615.5" y="318" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity="0.85">The Matrix</text>
  </g>

  <!-- 4. loop arrow: what the hours taught -->
  <g class="spin" filter="url(#glow)">
    <path d="M860.2 144.4 A40 40 0 1 1 832.8 144.4" fill="none" stroke="#f5b544" stroke-width="2.5" stroke-linecap="round" marker-end="url(#head)"/>
  </g>
  <text x="846.5" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#f5b544">What the hours taught</text>
  <text x="846.5" y="318" text-anchor="middle" font-size="12" fill="#c5cad6">Edge of Tomorrow,</text>
  <text x="846.5" y="336" text-anchor="middle" font-size="12" fill="#c5cad6">Groundhog Day</text>
</svg>
