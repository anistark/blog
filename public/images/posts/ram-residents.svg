<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="system-ui, sans-serif">
  <rect width="900" height="400" fill="#1a1a19"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#ffffff">One 16GB box, four resident agents</text>
  <text x="40" y="74" font-size="14" fill="#c3c2b7">setup guides say to budget about 2GB of RAM per agent</text>

  <!-- brace over the four agent segments -->
  <text x="378" y="118" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">8GB parked, idle almost all day</text>
  <path d="M 170 138 v -8 h 416 v 8" fill="none" stroke="#6e6c66" stroke-width="1.5"/>

  <!-- RAM bar: 820px = 16GB, so 51.25px per GB -->
  <clipPath id="barclip"><rect x="40" y="150" width="820" height="72" rx="10"/></clipPath>
  <g clip-path="url(#barclip)">
    <rect x="40" y="150" width="820" height="72" fill="#242423"/>
    <rect x="40" y="150" width="128" height="72" fill="#55534e"/>
    <rect x="170" y="150" width="102" height="72" fill="#d95926"/>
    <rect x="274" y="150" width="102" height="72" fill="#d95926"/>
    <rect x="378" y="150" width="102" height="72" fill="#d95926"/>
    <rect x="482" y="150" width="102" height="72" fill="#d95926"/>
  </g>
  <rect x="40" y="150" width="820" height="72" rx="10" fill="none" stroke="#3a3a38"/>

  <!-- scale ticks -->
  <text x="40" y="244" font-size="11" fill="#c3c2b7">0</text>
  <text x="245" y="244" font-size="11" fill="#c3c2b7" text-anchor="middle">4GB</text>
  <text x="450" y="244" font-size="11" fill="#c3c2b7" text-anchor="middle">8GB</text>
  <text x="655" y="244" font-size="11" fill="#c3c2b7" text-anchor="middle">12GB</text>
  <text x="860" y="244" font-size="11" fill="#c3c2b7" text-anchor="end">16GB</text>

  <!-- segment labels -->
  <text x="104" y="272" font-size="13" fill="#c3c2b7" text-anchor="middle">OS</text>
  <text x="221" y="272" font-size="13" fill="#c3c2b7" text-anchor="middle">agent 1</text>
  <text x="325" y="272" font-size="13" fill="#c3c2b7" text-anchor="middle">agent 2</text>
  <text x="429" y="272" font-size="13" fill="#c3c2b7" text-anchor="middle">agent 3</text>
  <text x="533" y="272" font-size="13" fill="#c3c2b7" text-anchor="middle">agent 4</text>
  <text x="723" y="272" font-size="13" fill="#c3c2b7" text-anchor="middle">free, 5.5GB</text>

  <text x="40" y="330" font-size="14" fill="#c3c2b7">Memory is the bottleneck, not CPU. The box tops out at four to six residents</text>
  <text x="40" y="352" font-size="14" fill="#c3c2b7">even though, most of the day, nothing is being computed.</text>
</svg>
