<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>Two objects side by side: an hourglass hanging on a chain, labelled extra hours, and a shallow stone bowl with silvery strands rising from it, labelled memories. Caption: a bigger bucket, a perfect archive, neither one is a skill</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/><stop offset="0.35" stop-color="#ffffff" stop-opacity="0.03"/><stop offset="0.8" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a404d"/><stop offset="1" stop-color="#1b1f27"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a505c"/><stop offset="1" stop-color="#1e222a"/></linearGradient>
    <linearGradient id="stone-side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.25"/></linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#e8eef8" stop-opacity="0.55"/><stop offset="1" stop-color="#9aa6bb" stop-opacity="0.12"/></radialGradient>
    <linearGradient id="strand" x1="0" y1="240" x2="0" y2="80" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#eef3fb" stop-opacity="0.95"/><stop offset="1" stop-color="#eef3fb" stop-opacity="0"/></linearGradient>
    <radialGradient id="mist" cx="700" cy="200" r="150" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#dfe6f2" stop-opacity="0.08"/><stop offset="1" stop-color="#dfe6f2" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm" cx="300" cy="215" r="130" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f5b544" stop-opacity="0.07"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1000" height="460" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="460" rx="20" fill="url(#sheen)"/>
  <rect width="1000" height="460" rx="20" fill="url(#mist)"/>
  <rect width="1000" height="460" rx="20" fill="url(#warm)"/>
  <rect x="0.5" y="0.5" width="999" height="459" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">MORE HOURS VS. MORE MEMORIES</text>

  <!-- hourglass on a chain -->
  <g fill="none" stroke="#c5cad6" stroke-opacity="0.75" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.01 7">
    <path d="M222 82 C232 120 268 146 296 152"/>
    <path d="M378 82 C368 120 332 146 304 152"/>
  </g>
  <circle cx="300" cy="157" r="7" fill="none" stroke="#c5cad6" stroke-opacity="0.85" stroke-width="2"/>
  <g transform="translate(300 160) scale(1.28) translate(-300 -160)">
    <path d="M276 188 C277 198 292 205 297 212 H303 C308 205 323 198 324 188 Z" fill="#f5b544" fill-opacity="0.85"/>
    <line x1="300" y1="213" x2="300" y2="250" stroke="#f5b544" stroke-width="1.5" stroke-dasharray="1.5 4" stroke-linecap="round"/>
    <path d="M272 256 C280 240 292 236 300 235 C308 236 320 240 328 256 Z" fill="#f5b544" fill-opacity="0.85"/>
    <path d="M268 172 C268 202 292 210 297 216 C292 222 268 230 268 258 H332 C332 230 308 222 303 216 C308 210 332 202 332 172 Z" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.5"/>
    <path d="M274 178 C274 194 282 202 289 208" fill="none" stroke="url(#hl)" stroke-width="1.5" stroke-linecap="round"/>
    <g stroke="#3a4152" stroke-width="3" stroke-linecap="round"><line x1="262" y1="171" x2="262" y2="259"/><line x1="338" y1="171" x2="338" y2="259"/></g>
    <rect x="256" y="165" width="88" height="7" rx="3.5" fill="url(#metal)" stroke="#ffffff" stroke-opacity="0.2"/>
    <rect x="256" y="258" width="88" height="7" rx="3.5" fill="url(#metal)" stroke="#ffffff" stroke-opacity="0.2"/>
  </g>

  <!-- stone bowl with memories rising -->
  <ellipse cx="700" cy="330" rx="96" ry="5" fill="#000000" fill-opacity="0.45"/>
  <path d="M672 300 L662 326 H738 L728 300 Z" fill="url(#stone)" stroke="#ffffff" stroke-opacity="0.14"/>
  <path d="M590 250 C592 288 628 304 660 306 H740 C772 304 808 288 810 250 Z" fill="url(#stone)"/>
  <path d="M590 250 C592 288 628 304 660 306 H740 C772 304 808 288 810 250 Z" fill="url(#stone-side)" stroke="#ffffff" stroke-opacity="0.14"/>
  <g stroke="#c5cad6" stroke-opacity="0.32" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M628 274 l6 6 l6 -6"/><path d="M656 284 v10 M652 289 h8"/><path d="M684 290 l5 -7 l5 7"/>
    <path d="M714 290 h10"/><path d="M744 284 l-4 8 h8 z"/><path d="M770 274 c4 4 8 4 10 0"/>
  </g>
  <ellipse cx="700" cy="250" rx="110" ry="22" fill="#1a1e26" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <ellipse cx="700" cy="252" rx="96" ry="15" fill="url(#pool)"/>
  <path d="M618 252 C650 260 750 260 782 252" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
  <g fill="none" stroke="url(#strand)" stroke-width="2" stroke-linecap="round" filter="url(#soft)">
    <path d="M664 252 C654 214 686 194 670 164 S676 120 688 96"/>
    <path d="M698 254 C712 214 686 184 704 150 S696 108 708 84"/>
    <path d="M734 252 C746 218 722 196 740 168 S750 132 740 108"/>
    <path d="M682 254 C688 228 672 212 682 190 S690 162 682 148"/>
    <path d="M716 254 C708 232 726 214 718 196"/>
  </g>

  <!-- labels -->
  <text x="300" y="368" text-anchor="middle" font-size="14" fill="#c5cad6">extra hours</text>
  <text x="700" y="368" text-anchor="middle" font-size="14" fill="#c5cad6">memories</text>

  <line x1="48" y1="392" x2="952" y2="392" stroke="#232834"/>
  <text x="48" y="426" font-size="17" font-weight="700" fill="#eef1f6">A bigger bucket. A perfect archive. <tspan fill="#f5b544">Neither one is a skill.</tspan></text>
</svg>
