<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="system-ui, sans-serif">
  <rect width="960" height="620" fill="#1a1a19"/>

  <text x="60" y="48" font-size="20" font-weight="700" fill="#ffffff">One agent, one sandbox server</text>
  <text x="60" y="74" font-size="14" fill="#c3c2b7">the agent talks to two things, and neither of them is your shell</text>

  <!-- agent box -->
  <rect x="60" y="110" width="300" height="110" rx="10" fill="#242423" stroke="#3987e5"/>
  <text x="84" y="146" font-size="16" font-weight="600" fill="#ffffff">sandbox_agent.py</text>
  <text x="84" y="172" font-size="13" fill="#c3c2b7">the loop, the dispatcher,</text>
  <text x="84" y="192" font-size="13" fill="#c3c2b7">the system prompt</text>

  <!-- claude box -->
  <rect x="600" y="110" width="300" height="110" rx="10" fill="#242423" stroke="#3a3a38"/>
  <text x="624" y="146" font-size="16" font-weight="600" fill="#ffffff">Claude, Messages API</text>
  <text x="624" y="172" font-size="13" fill="#c3c2b7">tool schemas in,</text>
  <text x="624" y="192" font-size="13" fill="#c3c2b7">tool_use blocks out</text>

  <!-- arrows between agent and claude -->
  <path d="M 372 146 L 588 146" stroke="#3987e5" stroke-width="2"/>
  <path d="M 588 146 l -9 -5 v 10 z" fill="#3987e5"/>
  <text x="480" y="138" font-size="12" fill="#c3c2b7" text-anchor="middle">messages + 7 tools</text>
  <path d="M 588 190 L 372 190" stroke="#199e70" stroke-width="2"/>
  <path d="M 372 190 l 9 -5 v 10 z" fill="#199e70"/>
  <text x="480" y="210" font-size="12" fill="#c3c2b7" text-anchor="middle">tool_use</text>

  <!-- arrow down into the server -->
  <path d="M 210 222 L 210 262" stroke="#3987e5" stroke-width="2"/>
  <path d="M 210 262 l -5 -9 h 10 z" fill="#3987e5"/>
  <text x="228" y="250" font-size="12" fill="#3987e5">POST /sessions &#183; POST /exec &#183; GET /files</text>

  <!-- server panel -->
  <rect x="60" y="270" width="840" height="310" rx="12" fill="#242423" stroke="#3a3a38"/>
  <text x="88" y="304" font-size="16" font-weight="600" fill="#ffffff">wasmrun agent</text>
  <text x="872" y="304" font-size="13" fill="#c3c2b7" text-anchor="end">127.0.0.1:8430</text>
  <line x1="88" y1="318" x2="872" y2="318" stroke="#3a3a38"/>

  <!-- session cards -->
  <rect x="88" y="336" width="230" height="126" rx="8" fill="#223349" stroke="#3987e5"/>
  <text x="108" y="364" font-size="13" font-weight="600" fill="#ffffff">session a1b2c3</text>
  <text x="108" y="390" font-size="12" fill="#c3c2b7">own temp dir</text>
  <text x="108" y="410" font-size="12" fill="#c3c2b7">own env vars</text>
  <text x="108" y="430" font-size="12" fill="#c3c2b7">256 MB / 100 MB</text>
  <text x="108" y="450" font-size="12" fill="#c3c2b7">no network</text>

  <rect x="365" y="336" width="230" height="126" rx="8" fill="#223349" stroke="#3987e5"/>
  <text x="385" y="364" font-size="13" font-weight="600" fill="#ffffff">session d4e5f6</text>
  <text x="385" y="390" font-size="12" fill="#c3c2b7">own temp dir</text>
  <text x="385" y="410" font-size="12" fill="#c3c2b7">own env vars</text>
  <text x="385" y="430" font-size="12" fill="#c3c2b7">256 MB / 100 MB</text>
  <text x="385" y="450" font-size="12" fill="#c3c2b7">no network</text>

  <rect x="642" y="336" width="230" height="126" rx="8" fill="#1a1a19" stroke="#55534e" stroke-dasharray="5 5"/>
  <text x="757" y="404" font-size="13" fill="#55534e" text-anchor="middle">up to 100 of them</text>

  <text x="88" y="488" font-size="13" fill="#d95926">isolated from each other, from the host, and from the internet</text>

  <!-- engine strip -->
  <rect x="88" y="502" width="784" height="62" rx="8" fill="#3987e5"/>
  <text x="480" y="528" font-size="14" font-weight="600" fill="#10100f" text-anchor="middle">WASM interpreter + WASI, the same engine as wasmrun exec</text>
  <text x="480" y="550" font-size="13" fill="#10100f" text-anchor="middle">JS and TS run on the nodejs runtime, TypeScript transpiled in the sandbox</text>
</svg>
