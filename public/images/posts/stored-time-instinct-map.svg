<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>A two by two map. Up: how regular the world is. Right: how fast and clear the feedback is. Top right, kind, build and trust instinct: chess, fire command, cricket batting, onboarding and copy tests, Phil's February 2nd. Top left, learnable if you build feedback: cancer surgery outcomes, therapy long-term outcomes. Bottom right, fast but noisy, feedback teaches luck: forecasting tournaments. Bottom left, wicked, hunches are hypotheses: will this market exist in 3 years? Placements are judgments, not measurements</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/></linearGradient>
  </defs>

  <rect width="1000" height="670" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="670" rx="20" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="999" height="669" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">WHERE INSTINCT CAN BE BUILT</text>

  <rect x="140" y="96" width="395.0" height="225.0" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="160" y="128" font-size="17" font-weight="700" fill="#eef1f6">Learnable</text>
  <text x="160" y="150" font-size="13" fill="#c5cad6">if you build feedback</text>
