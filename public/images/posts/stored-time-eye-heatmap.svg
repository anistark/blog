<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>A schematic chessboard with an eye-tracking heat map: a warm glow and a scan path cluster over the squares of the familiar mate near the black king, labelled where they looked, while three faint, unvisited squares on the other side of the board are labelled where the better answer was</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <radialGradient id="heat"><stop offset="0" stop-color="#f5b544" stop-opacity="0.75"/><stop offset="0.55" stop-color="#f5b544" stop-opacity="0.28"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></radialGradient>
    <radialGradient id="heat-core"><stop offset="0" stop-color="#f2676b" stop-opacity="0.7"/><stop offset="1" stop-color="#f2676b" stop-opacity="0"/></radialGradient>
    <linearGradient id="board-sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="board"><rect x="340" y="96" width="320" height="320" rx="4"/></clipPath>
  </defs>

  <rect width="1000" height="480" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="480" rx="20" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="999" height="479" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">WHERE THE EYES KEPT GOING</text>

  <!-- board -->
  <rect x="340" y="96" width="320" height="320" rx="4" fill="#ffffff" fill-opacity="0.02"/>
  <g fill="#ffffff" fill-opacity="0.065" clip-path="url(#board)">
    <rect x="340" y="96" width="40" height="40"/><rect x="420" y="96" width="40" height="40"/><rect x="500" y="96" width="40" height="40"/><rect x="580" y="96" width="40" height="40"/>
    <rect x="380" y="136" width="40" height="40"/><rect x="460" y="136" width="40" height="40"/><rect x="540" y="136" width="40" height="40"/><rect x="620" y="136" width="40" height="40"/>
    <rect x="340" y="176" width="40" height="40"/><rect x="420" y="176" width="40" height="40"/><rect x="500" y="176" width="40" height="40"/><rect x="580" y="176" width="40" height="40"/>
    <rect x="380" y="216" width="40" height="40"/><rect x="460" y="216" width="40" height="40"/><rect x="540" y="216" width="40" height="40"/><rect x="620" y="216" width="40" height="40"/>
    <rect x="340" y="256" width="40" height="40"/><rect x="420" y="256" width="40" height="40"/><rect x="500" y="256" width="40" height="40"/><rect x="580" y="256" width="40" height="40"/>
    <rect x="380" y="296" width="40" height="40"/><rect x="460" y="296" width="40" height="40"/><rect x="540" y="296" width="40" height="40"/><rect x="620" y="296" width="40" height="40"/>
    <rect x="340" y="336" width="40" height="40"/><rect x="420" y="336" width="40" height="40"/><rect x="500" y="336" width="40" height="40"/><rect x="580" y="336" width="40" height="40"/>
    <rect x="380" y="376" width="40" height="40"/><rect x="460" y="376" width="40" height="40"/><rect x="540" y="376" width="40" height="40"/><rect x="620" y="376" width="40" height="40"/>
  </g>
  <rect x="340" y="96" width="320" height="320" rx="4" fill="url(#board-sheen)"/>
  <rect x="340" y="96" width="320" height="320" rx="4" fill="none" stroke="#3a4152" stroke-width="1.5"/>

  <!-- coordinates -->
  <g font-size="12" fill="#7d8597" text-anchor="middle">
    <text x="360" y="438">a</text><text x="400" y="438">b</text><text x="440" y="438">c</text><text x="480" y="438">d</text>
    <text x="520" y="438">e</text><text x="560" y="438">f</text><text x="600" y="438">g</text><text x="640" y="438">h</text>
    <text x="324" y="120">8</text><text x="324" y="160">7</text><text x="324" y="200">6</text><text x="324" y="240">5</text>
    <text x="324" y="280">4</text><text x="324" y="320">3</text><text x="324" y="360">2</text><text x="324" y="400">1</text>
  </g>

  <!-- heat map over the familiar mate -->
  <g clip-path="url(#board)" style="mix-blend-mode: screen">
    <g filter="url(#blur)">
      <circle cx="600" cy="156" r="46" fill="url(#heat)"/>
      <circle cx="636" cy="164" r="40" fill="url(#heat)"/>
      <circle cx="562" cy="160" r="36" fill="url(#heat)"/>
      <circle cx="600" cy="118" r="32" fill="url(#heat)"/>
      <circle cx="636" cy="202" r="30" fill="url(#heat)" opacity="0.8"/>
      <circle cx="598" cy="204" r="26" fill="url(#heat)" opacity="0.6"/>
      <circle cx="560" cy="120" r="24" fill="url(#heat)" opacity="0.5"/>
      <circle cx="604" cy="158" r="22" fill="url(#heat-core)"/>
      <circle cx="636" cy="164" r="18" fill="url(#heat-core)" opacity="0.8"/>
    </g>
  </g>

  <!-- the better answer, never looked at -->
  <g fill="none" stroke="#c5cad6" stroke-opacity="0.45" stroke-width="1.25" stroke-dasharray="3 4">
    <rect x="384" y="340" width="32" height="32" rx="3"/>
    <rect x="424" y="300" width="32" height="32" rx="3"/>
    <rect x="464" y="260" width="32" height="32" rx="3"/>
  </g>
  <g fill="#c5cad6" fill-opacity="0.35"><circle cx="400" cy="356" r="2.5"/><circle cx="440" cy="316" r="2.5"/><circle cx="480" cy="276" r="2.5"/></g>

  <!-- pieces, schematic -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <g stroke="#c5cad6" stroke-width="1.5">
      <circle cx="640" cy="116" r="12" fill="#0a0c10"/><circle cx="600" cy="116" r="12" fill="#0a0c10"/>
      <circle cx="600" cy="156" r="10" fill="#0a0c10"/><circle cx="640" cy="156" r="10" fill="#0a0c10"/>
    </g>
    <text x="640" y="120" fill="#c5cad6">K</text><text x="600" y="120" fill="#c5cad6">R</text>
    <text x="600" y="159.5" font-size="10" fill="#c5cad6">P</text><text x="640" y="159.5" font-size="10" fill="#c5cad6">P</text>
    <g fill="#eef1f6" stroke="#0a0c10" stroke-width="1.5">
      <circle cx="520" cy="196" r="12"/><circle cx="360" cy="396" r="12"/><circle cx="600" cy="396" r="12"/><circle cx="480" cy="396" r="12"/>
    </g>
    <text x="520" y="200" fill="#12151c">N</text><text x="360" y="400" fill="#12151c">Q</text>
    <text x="600" y="400" fill="#12151c">K</text><text x="480" y="400" fill="#12151c">R</text>
  </g>

  <!-- scan path: the eyes kept coming back -->
  <g fill="none" stroke="#eef1f6" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="2 3">
    <path d="M566 166 L612 132 L646 176 L604 198 L556 150 L632 208 L596 168 L566 126 L618 160"/>
  </g>
  <g fill="#eef1f6" fill-opacity="0.12" stroke="#eef1f6" stroke-opacity="0.7" stroke-width="1">
    <circle cx="566" cy="166" r="5"/><circle cx="612" cy="132" r="7"/><circle cx="646" cy="176" r="4"/>
    <circle cx="604" cy="198" r="5"/><circle cx="556" cy="150" r="4"/><circle cx="632" cy="208" r="3.5"/>
    <circle cx="596" cy="168" r="6"/><circle cx="566" cy="126" r="3.5"/><circle cx="618" cy="160" r="8"/>
  </g>

  <!-- labels -->
  <line x1="668" y1="160" x2="712" y2="160" stroke="#f5b544" stroke-opacity="0.7" stroke-width="1.25"/>
  <circle cx="720" cy="160" r="3.5" fill="#f5b544"/>
  <text x="734" y="165" font-size="15" font-weight="700" fill="#eef1f6">where they looked</text>
  <text x="734" y="186" font-size="12" fill="#7d8597">the familiar five-move mate</text>

  <line x1="378" y1="356" x2="290" y2="356" stroke="#c5cad6" stroke-opacity="0.45" stroke-width="1.25" stroke-dasharray="3 4"/>
  <circle cx="282" cy="356" r="3.5" fill="none" stroke="#c5cad6" stroke-opacity="0.7"/>
  <text x="268" y="361" font-size="15" font-weight="700" fill="#c5cad6" text-anchor="end">where the better</text>
  <text x="268" y="381" font-size="15" font-weight="700" fill="#c5cad6" text-anchor="end">answer was</text>
  <text x="268" y="402" font-size="12" fill="#7d8597" text-anchor="end">a shorter, three-move mate</text>
</svg>
