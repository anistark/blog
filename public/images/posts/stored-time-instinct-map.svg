  <rect x="140" y="331.0" width="395.0" height="225.0" rx="12" fill="#ffffff" fill-opacity="0.015" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="160" y="363.0" font-size="17" font-weight="700" fill="#eef1f6">Wicked</text>
  <text x="160" y="385.0" font-size="13" fill="#c5cad6">hunches are hypotheses</text>
  <rect x="545.0" y="331.0" width="395.0" height="225.0" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="565.0" y="363.0" font-size="17" font-weight="700" fill="#eef1f6">Fast but noisy</text>
