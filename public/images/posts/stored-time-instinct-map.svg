  <circle cx="178" cy="500" r="5" fill="#f5b544"/>
  <text x="192" y="504.5" font-size="13" fill="#c5cad6">“Will this market exist in 3 years?”</text>
  <line x1="118" y1="556" x2="118" y2="98" stroke="#3a4152" stroke-width="1.5"/>
  <path d="M113 106 L118 97 L123 106" fill="none" stroke="#3a4152" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text transform="translate(104 326.0) rotate(-90)" text-anchor="middle" font-size="13" fill="#7d8597">how regular the world is</text>
