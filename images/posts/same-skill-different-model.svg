<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, sans-serif">
  <title>One SKILL.md flowing into three models, Opus 5.5, Sonnet 5.5 and Haiku 4.5, with an unknown outcome for each</title>
  <style>
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .pulse.b { animation-delay: .8s; }
    .pulse.c { animation-delay: 1.6s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
      .dot { display: none; }
    }
  </style>
  <rect width="1200" height="630" fill="#1a1a19"/>

  <text x="60" y="86" font-size="40" font-weight="700" fill="#ffffff">Same skill, different model</text>
  <text x="60" y="124" font-size="19" fill="#c3c2b7">"works on my model" is the new "works on my machine"</text>

  <!-- SKILL.md card -->
  <rect x="60" y="200" width="280" height="300" rx="12" fill="#242423" stroke="#3987e5" stroke-width="1.5"/>
  <text x="84" y="236" font-size="16" font-weight="600" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SKILL.md</text>
  <line x1="84" y1="252" x2="316" y2="252" stroke="#3a3a38"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="84" y="278" fill="#6b6b66">---</text>
    <text x="84" y="298" fill="#c3c2b7">name: greeter</text>
    <text x="84" y="318" fill="#c3c2b7">description: Writes…</text>
    <text x="84" y="338" fill="#6b6b66">---</text>
  </g>
  <rect x="84" y="360" width="220" height="9" rx="4.5" fill="#3a3a38"/>
  <rect x="84" y="380" width="190" height="9" rx="4.5" fill="#3a3a38"/>
  <rect x="84" y="400" width="232" height="9" rx="4.5" fill="#3a3a38"/>
  <rect x="84" y="420" width="160" height="9" rx="4.5" fill="#3a3a38"/>
  <rect x="84" y="440" width="205" height="9" rx="4.5" fill="#3a3a38"/>
  <rect x="84" y="460" width="120" height="9" rx="4.5" fill="#3a3a38"/>

  <!-- lanes -->
  <path id="lane1" d="M 340 350 C 520 350, 560 235, 760 235" fill="none" stroke="#3a3a38" stroke-width="2"/>
  <path id="lane2" d="M 340 350 C 520 350, 560 365, 760 365" fill="none" stroke="#3a3a38" stroke-width="2"/>
  <path id="lane3" d="M 340 350 C 520 350, 560 495, 760 495" fill="none" stroke="#3a3a38" stroke-width="2"/>

  <g class="dot" fill="#3987e5">
    <circle r="6" visibility="hidden"><set attributeName="visibility" to="visible" begin="0s"/><animateMotion dur="3s" begin="0s" repeatCount="indefinite"><mpath href="#lane1"/></animateMotion></circle>
    <circle r="6" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.5s"/><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#lane1"/></animateMotion></circle>
    <circle r="6" visibility="hidden"><set attributeName="visibility" to="visible" begin=".5s"/><animateMotion dur="3s" begin=".5s" repeatCount="indefinite"><mpath href="#lane2"/></animateMotion></circle>
    <circle r="6" visibility="hidden"><set attributeName="visibility" to="visible" begin="2s"/><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#lane2"/></animateMotion></circle>
    <circle r="6" visibility="hidden"><set attributeName="visibility" to="visible" begin="1s"/><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#lane3"/></animateMotion></circle>
    <circle r="6" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.5s"/><animateMotion dur="3s" begin="2.5s" repeatCount="indefinite"><mpath href="#lane3"/></animateMotion></circle>
  </g>

  <!-- model boxes -->
  <rect x="760" y="190" width="200" height="90" rx="10" fill="#242423" stroke="#3a3a38"/>
  <text x="784" y="228" font-size="18" font-weight="600" fill="#ffffff">Opus 5.5</text>
  <text x="784" y="254" font-size="13" fill="#c3c2b7">loads it? follows it?</text>

  <rect x="760" y="320" width="200" height="90" rx="10" fill="#242423" stroke="#3a3a38"/>
  <text x="784" y="358" font-size="18" font-weight="600" fill="#ffffff">Sonnet 5.5</text>
  <text x="784" y="384" font-size="13" fill="#c3c2b7">loads it? follows it?</text>

  <rect x="760" y="450" width="200" height="90" rx="10" fill="#242423" stroke="#3a3a38"/>
  <text x="784" y="488" font-size="18" font-weight="600" fill="#ffffff">Haiku 4.5</text>
  <text x="784" y="514" font-size="13" fill="#c3c2b7">loads it? follows it?</text>

  <!-- outcomes -->
  <g stroke="#3a3a38" stroke-width="2">
    <line x1="960" y1="235" x2="1040" y2="235"/>
    <line x1="960" y1="365" x2="1040" y2="365"/>
    <line x1="960" y1="495" x2="1040" y2="495"/>
  </g>
  <g font-size="26" font-weight="700" text-anchor="middle" fill="#3987e5">
    <g class="pulse">
      <circle cx="1080" cy="235" r="30" fill="#223349" stroke="#3987e5" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text x="1080" y="244">?</text>
    </g>
    <g class="pulse b">
      <circle cx="1080" cy="365" r="30" fill="#223349" stroke="#3987e5" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text x="1080" y="374">?</text>
    </g>
    <g class="pulse c">
      <circle cx="1080" cy="495" r="30" fill="#223349" stroke="#3987e5" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text x="1080" y="504">?</text>
    </g>
  </g>

  <text x="60" y="586" font-size="15" fill="#c3c2b7">trigger rate · pass rate · vs baseline</text>
  <text x="1140" y="586" font-size="15" fill="#6b6b66" text-anchor="end">sutras bench</text>
</svg>
