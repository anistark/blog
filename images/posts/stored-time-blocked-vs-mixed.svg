<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>Two gallery walls hold the same twelve paintings by three painters. On the left wall they hang in neat blocks, one painter per row, and a visitor there says this felt easier: 35% correct on new paintings. On the right wall the same paintings are shuffled: 61% correct</title>
  <style id="jbm-font">@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151c"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.055"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <filter id="soft" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.75"><stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/></linearGradient>

    <g id="frame">
      <rect width="68" height="50" rx="3" fill="url(#canvas)" stroke="#3a4152" stroke-width="2"/>
      <rect x="5" y="5" width="58" height="40" rx="1" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </g>
    <g id="pa">
      <use href="#frame"/>
      <g fill="none" stroke="#c5cad6" stroke-opacity="0.85" stroke-width="1.5" stroke-linecap="round">
        <circle cx="25" cy="22" r="8.5" fill="#ffffff" fill-opacity="0.08"/>
        <circle cx="44" cy="29" r="4.5"/>
        <line x1="10" y1="38" x2="58" y2="38" stroke-opacity="0.45"/>
      </g>
    </g>
    <g id="pb">
      <use href="#frame"/>
      <g fill="none" stroke="#c5cad6" stroke-opacity="0.85" stroke-width="1.5" stroke-linecap="round">
        <path d="M11 18 q6 -5 12 0 t12 0 t12 0 t10 0"/>
        <path d="M11 27 q6 -5 12 0 t12 0 t12 0 t10 0"/>
        <path d="M11 36 q6 -5 12 0 t12 0 t12 0 t10 0" stroke-opacity="0.5"/>
      </g>
    </g>
    <g id="pc">
      <use href="#frame"/>
      <g fill="none" stroke="#c5cad6" stroke-opacity="0.85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 39 L22 20 L31 31 L41 13 L58 39" fill="#ffffff" fill-opacity="0.06"/>
        <line x1="10" y1="39" x2="58" y2="39" stroke-opacity="0.45"/>
      </g>
    </g>
  </defs>

  <rect width="1000" height="540" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="540" rx="20" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="999" height="539" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="52" cy="44" r="3.5" fill="#f5b544"/>
  <text x="66" y="48" font-size="12" letter-spacing="2.4" fill="#7d8597">BLOCKED VS. MIXED</text>

  <!-- walls and floors -->
  <rect x="48" y="72" width="428" height="224" rx="10" fill="url(#wall)" stroke="#232834"/>
  <rect x="48" y="72" width="428" height="160" rx="10" fill="url(#spot)"/>
  <rect x="48" y="296" width="428" height="82" fill="url(#floor)"/><line x1="48" y1="378" x2="476" y2="378" stroke="#2c3240" stroke-width="1.5"/>
  <rect x="524" y="72" width="428" height="224" rx="10" fill="url(#wall)" stroke="#232834"/>
  <rect x="524" y="72" width="428" height="160" rx="10" fill="url(#spot)"/>
  <rect x="524" y="296" width="428" height="82" fill="url(#floor)"/><line x1="524" y1="378" x2="952" y2="378" stroke="#2c3240" stroke-width="1.5"/>

  <!-- left: blocked, one painter per row -->
  <use href="#pa" x="99" y="94"/><use href="#pa" x="185" y="94"/><use href="#pa" x="271" y="94"/><use href="#pa" x="357" y="94"/>
  <use href="#pb" x="99" y="160"/><use href="#pb" x="185" y="160"/><use href="#pb" x="271" y="160"/><use href="#pb" x="357" y="160"/>
  <use href="#pc" x="99" y="226"/><use href="#pc" x="185" y="226"/><use href="#pc" x="271" y="226"/><use href="#pc" x="357" y="226"/>

  <!-- right: the same twelve, shuffled -->
  <use href="#pa" x="575" y="94"/><use href="#pc" x="661" y="94"/><use href="#pb" x="747" y="94"/><use href="#pa" x="833" y="94"/>
  <use href="#pb" x="575" y="160"/><use href="#pa" x="661" y="160"/><use href="#pc" x="747" y="160"/><use href="#pc" x="833" y="160"/>
  <use href="#pc" x="575" y="226"/><use href="#pb" x="661" y="226"/><use href="#pa" x="747" y="226"/><use href="#pb" x="833" y="226"/>

  <!-- visitor at the blocked wall -->
  <ellipse cx="300" cy="378" rx="30" ry="3.5" fill="#000000" fill-opacity="0.5"/>
  <g stroke="#c5cad6" stroke-width="1.5" stroke-linejoin="round">
    <path d="M281 377 V346 Q281 326 300 326 Q319 326 319 346 V378" fill="#161a22"/>
    <circle cx="300" cy="308" r="11" fill="#161a22"/>
  </g>
  <g>
    <path d="M334 306 H462 Q472 306 472 316 V328 Q472 338 462 338 H334 Q324 338 324 328 V324 L313 316 L324 315 V316 Q324 306 334 306 Z" fill="#1b2029" stroke="#3a4152" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="398" y="327" font-size="13" fill="#eef1f6" text-anchor="middle">This felt easier.</text>
  </g>

  <!-- results -->
  <text x="48" y="438" font-size="40" font-weight="700" fill="#c5cad6">35%</text>
  <text x="136" y="420" font-size="14" font-weight="700" fill="#eef1f6">blocked by painter</text>
  <text x="136" y="439" font-size="12" fill="#7d8597">correct on new paintings</text>

  <text x="524" y="438" font-size="40" font-weight="700" fill="#f5b544" opacity="0.55" filter="url(#soft)">61%</text>
  <text x="524" y="438" font-size="40" font-weight="700" fill="#f5b544">61%</text>
  <text x="612" y="420" font-size="14" font-weight="700" fill="#eef1f6">mixed together</text>
  <text x="612" y="439" font-size="12" fill="#7d8597">correct on new paintings</text>

  <line x1="48" y1="462" x2="952" y2="462" stroke="#232834"/>
  <text x="48" y="492" font-size="17" font-weight="700" fill="#eef1f6">It did feel easier, and it worked worse.</text>
  <text x="48" y="516" font-size="13" fill="#7d8597">78% believed the blocked way had worked as well or better</text>
</svg>
