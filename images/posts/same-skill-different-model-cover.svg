<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, sans-serif">
  <title>Same skill, different model: why agent skills don't transfer between models</title>
  <rect width="1200" height="630" fill="#1a1a19"/>

  <text x="80" y="256" font-size="76" font-weight="700" fill="#ffffff">Same skill,</text>
  <text x="80" y="346" font-size="76" font-weight="700" fill="#3987e5">different model.</text>
  <text x="80" y="414" font-size="24" fill="#c3c2b7">why agent skills don't transfer between models</text>

  <g fill="none" stroke-width="2">
    <path d="M 912 315 C 980 315, 1010 215, 1080 215" stroke="#3a3a38"/>
    <path d="M 912 315 L 1080 315" stroke="#3a3a38"/>
    <path d="M 912 315 C 980 315, 1010 415, 1080 415" stroke="#3a3a38"/>
  </g>
  <rect x="848" y="283" width="64" height="64" rx="12" fill="#242423" stroke="#3987e5" stroke-width="2"/>
  <rect x="864" y="303" width="32" height="5" rx="2.5" fill="#3a3a38"/>
  <rect x="864" y="313" width="24" height="5" rx="2.5" fill="#3a3a38"/>
  <rect x="864" y="323" width="28" height="5" rx="2.5" fill="#3a3a38"/>
  <circle cx="1100" cy="215" r="14" fill="#3987e5"/>
  <circle cx="1100" cy="315" r="14" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/>
  <circle cx="1100" cy="415" r="14" fill="#1a1a19" stroke="#3987e5" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="80" y="560" font-size="14" font-weight="700" letter-spacing="3" fill="#6b6b66">AGENT SKILLS · RESEARCH</text>
</svg>
